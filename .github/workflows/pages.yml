name: CI and Pages deploy
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent Pages deployment; never cancel an in-progress one.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Runs on every push and pull request: typecheck, test, build.
  # Pull requests stop here (tested but not published).
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '24' }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Only stage the site for deployment on pushes to main.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with: { path: dist }

  # Publishes to GitHub Pages only for pushes to main, so PRs can't deploy.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.deployment.outputs.page_url }}' }
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
